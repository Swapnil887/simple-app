
name: Build and Deploy Node API

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run tests
      - name: Run tests
        run: npm test --if-present

      # 5. Configure AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 7. Build Docker image
      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

      # 8. Push image to ECR
      - name: Push Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # 9. Deploy image to EC2 through SSM
      - name: Deploy to EC2
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_SCRIPT=$(cat <<EOF
          set -eu

          REGISTRY="${REGISTRY}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "Logging in to ECR"

          aws ecr get-login-password \
            --region "${AWS_REGION}" | \
            docker login \
            --username AWS \
            --password-stdin "${REGISTRY}"

          echo "Pulling image: \${IMAGE}"

          docker pull "\${IMAGE}"

          echo "Preparing application environment"

          mkdir -p /opt/simple-app

          umask 077

          aws ssm get-parameters \
            --region "${AWS_REGION}" \
            --names \
              "/simple-app/DB_HOST" \
              "/simple-app/DB_USERNAME" \
              "/simple-app/DB_PASSWORD" \
              "/simple-app/JWT_SECRET" \
              "/simple-app/MESSAGE" \
            --with-decryption \
            --query 'Parameters[*].[Name,Value]' \
            --output text |
            while IFS="$(printf '\\t')" read -r name value; do
              key="\${name##*/}"
              printf '%s=%s\\n' "\${key}" "\${value}"
            done > /opt/simple-app/.env

          chmod 600 /opt/simple-app/.env

          echo "Starting new container"

          docker rm -f simple-app || true

          docker run -d \
            --name simple-app \
            --restart unless-stopped \
            --env-file /opt/simple-app/.env \
            -e PORT=3000 \
            -p 127.0.0.1:3000:3000 \
            "\${IMAGE}"

          echo "Checking application health"

          for i in \$(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000; then
              echo "Deployment successful"
              exit 0
            fi

            sleep 2
          done

          echo "Application health check failed"
          docker logs --tail 100 simple-app
          exit 1
          EOF
          )

          PARAMETERS=$(jq -n --arg command "$DEPLOY_SCRIPT" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Node API $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut|Cancelling)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$EC2_INSTANCE_ID" \
                --query '[StandardOutputContent,StandardErrorContent]' \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out waiting for SSM"
          exit 1
